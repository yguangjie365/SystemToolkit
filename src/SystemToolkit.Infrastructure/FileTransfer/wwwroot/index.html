<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <!-- 移动端 viewport：适配手机屏幕，禁用缩放避免双指误操作 -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- 顶栏色跟随系统明暗（浅色 PrimaryDeepBrush / 深色深蓝黑） -->
    <meta name="theme-color" content="#2C4258" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101A24" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="SystemToolkit 文件互传 - 通过浏览器访问电脑共享文件" />
    <meta name="referrer" content="no-referrer" />
    <title>SystemToolkit · 文件互传</title>
    <!-- 静态资源已免令牌（见 FileWebServer.IsPublicAsset）：
         页面本身不含数据，扫码进入（URL 只有配对码）与刷新页面都要能加载外壳，
         配对由 app.js 调 /api/pair 完成，数据边界由 /api 与 /ws 的令牌守住。 -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="app">
        <!-- ============ 顶部状态栏 ============ -->
        <header class="status-bar" role="banner">
            <span class="status-bar__title">SystemToolkit</span>
            <span class="status-bar__conn" id="connStatus" aria-live="polite">
                <span class="status-bar__dot" id="connDot"></span>
                <span id="connText">连接中…</span>
            </span>
            <span class="status-bar__host" id="hostInfo"></span>
        </header>

        <!-- 证书变更横幅（默认隐藏，协议 §6.3）：服务端证书轮换/重签后必须显式提示
             「证书已变更」，否则用户会把浏览器的证书警告误读成中间人攻击。
             由 app.js 的 checkCertFingerprint() 与上次记录的指纹比对后决定是否展开。 -->
        <div class="cert-banner" id="certBanner" role="alert" hidden>
            <div class="cert-banner__title">⚠️ 证书已变更，请重新信任</div>
            <div class="cert-banner__body">
                这台电脑重新签发了 HTTPS 证书（例如 90 天到期轮换、或换了网卡 IP）。
                浏览器此时提示"证书不受信任"属于预期，<b>不是</b>中间人攻击；
                但请先确认这确实是你自己的电脑，再继续使用。
            </div>
            <div class="cert-banner__fp" id="certBannerDetail"></div>
            <button type="button" class="cert-banner__btn" id="certBannerAck">知道了（记录当前指纹）</button>
        </div>

        <!-- 配对状态条（P3 ⑲「记住此设备」）：把"这台设备凭什么能访问"如实写在页面上。
             免配对与本次会话的失效时机完全不同，混成一句会让用户判断错。 -->
        <section class="pair-state" id="pairState" aria-live="polite" hidden>
            <span class="pair-state__text" id="pairStateText"></span>
            <label class="pair-state__remember" id="rememberRow">
                <input type="checkbox" id="rememberDevice" />
                <span>记住此设备（30 天免配对）</span>
            </label>
            <button type="button" class="pair-state__forget" id="forgetDevice" hidden>忘记此设备</button>
        </section>

        <!-- ============ 主内容区 ============ -->
        <main class="main" role="main">

            <!-- ===== 对话（OL-B11 / W1b：会话式窗口，默认页）=====
                 「我发出的文件」气泡复用既有的 uploadList 容器与 .upload-task 元素
                 （app.js 的进度/状态/汇总机制原封不动），系统提示由 addChatNotice()
                 追加到同一容器，天然按时间顺序排列。 -->
            <section class="tab-panel is-active" data-tab="chat" id="panelChat"
                     aria-label="对话">
                <!-- 会话流容器：id 沿用 uploadList，避免改名引发连锁改动 -->
                <div class="upload-list chat-stream" id="uploadList" aria-live="polite"></div>

                <!-- 拖放目标（桌面浏览器拖入即可发送）；点击它同样打开文件选择。
                     选择按钮已移入下方「+」动作单，这里只留一条轻提示。 -->
                <div class="upload-zone upload-zone--slim" id="uploadZone" role="button"
                     tabindex="0" aria-label="点击或拖入文件上传">
                    <div class="upload-zone__slim-text">拖入文件即可发送，或点下方 +</div>
                </div>

                <!-- 待续传（2026-09-13）：下拉刷新/重载后列出未完成任务；空则整块隐藏。
                     续传必须由用户重选文件——浏览器不允许页面自行恢复 File 句柄。 -->
                <div class="pending-resume" id="pendingResume" hidden>
                    <div class="pending-resume__head">
                        <span class="pending-resume__title" id="pendingResumeTitle"></span>
                        <button type="button" class="toolbar-btn" id="pendingClearAllBtn">全部清除</button>
                    </div>
                    <div class="pending-resume__list" id="pendingResumeList"></div>
                    <p class="pending-resume__hint">续传需同名 + 同大小 + 同修改时间；不匹配时直接点下方「+」即按新文件上传。</p>
                </div>
                <input type="file" id="resumeInput" style="display:none" aria-hidden="true" />

                <!-- 上传记录汇总 + 清除（2026-09-11 主人反馈：记录只增不减，需要能清掉） -->
                <div class="upload-summary" id="uploadSummary" hidden>
                    <span class="upload-summary__text" id="uploadSummaryText"></span>
                    <button type="button" class="toolbar-btn" id="clearUploadsBtn">清除记录</button>
                </div>

                <!-- 底部输入区（W2b）：+ 发文件 / 文本框发文本 / 发送。
                     🔴 两条与桌面端不同的已定差异：
                     ① 网页端**没有确认门**（用户在场即确认）；
                     ② **不自动写剪贴板**（移动浏览器要求用户手势）→ 由「点气泡复制」触发。 -->
                <div class="chat-composer">
                    <button type="button" class="chat-composer__add" id="chatAddBtn"
                            aria-expanded="false" aria-controls="chatActionSheet"
                            aria-label="添加文件">+</button>
                    <!-- 多行输入：Enter 换行（手机习惯），Ctrl/Cmd+Enter 发送。
                         rows=1 起步、由 JS 按内容长高（最多 5 行后内部滚动）。 -->
                    <textarea class="chat-composer__input" id="chatInput" rows="1"
                              placeholder="输入文字…" aria-label="输入文本"
                              enterkeyhint="enter" autocomplete="off"></textarea>
                    <button type="button" class="chat-composer__send" id="chatSendBtn"
                            aria-label="发送文本" disabled>发送</button>
                </div>

                <!-- 输入提示行：只在「接近上限 / 超限」时出现（平时不占视觉份额） -->
                <div class="chat-composer__meta" id="chatComposerMeta" hidden></div>

                <!-- 「+」动作单（默认收起，点 + 展开） -->
                <div class="chat-sheet" id="chatActionSheet" hidden>
                    <button type="button" class="chat-sheet__item" id="pickBtn">选择文件</button>
                    <button type="button" class="chat-sheet__item" id="pickDirBtn">选择文件夹</button>
                    <button type="button" class="chat-sheet__cancel" id="chatSheetCancel">取消</button>
                </div>

                <input type="file" id="fileInput" multiple
                       style="display:none" aria-hidden="true" />
                <input type="file" id="dirInput" multiple webkitdirectory directory
                       style="display:none" aria-hidden="true" />
            </section>

            <!-- ===== 文件浏览 ===== -->
            <section class="tab-panel" data-tab="browse" id="panelBrowse"
                     aria-label="文件浏览">
                <!-- 面包屑导航 + 多选入口 -->
                <div class="browse-toolbar">
                    <nav class="breadcrumb" id="breadcrumb" aria-label="路径导航"></nav>
                    <button type="button" class="toolbar-btn" id="multiToggleBtn">多选</button>
                </div>

                <!-- 文件列表容器（由 app.js 动态渲染） -->
                <div class="file-list" id="fileList" role="list"></div>

                <!-- 多选操作条（进入多选模式后显示） -->
                <div class="multi-bar" id="multiBar" hidden>
                    <span>已选 <strong id="multiCount">0</strong> 项</span>
                    <button type="button" class="toolbar-btn" id="multiZipBtn" disabled>打包下载</button>
                    <button type="button" class="toolbar-btn" id="multiExitBtn">取消</button>
                </div>
            </section>

            <!-- ===== 设备列表 ===== -->
            <section class="tab-panel" data-tab="devices" id="panelDevices"
                     aria-label="已发现设备">
                <!-- 标题口径（2026-09-11 主人选定）：列表含「本机 + 在线浏览器」两类，
                     故标题用「在线设备」，计数与下方卡片数量严格对应 -->
                <h2 class="section-title">
                    在线设备
                    <span class="section-title__count" id="deviceCount">0</span>
                </h2>
                <div class="device-list" id="deviceList" role="list"></div>
            </section>

        </main>

        <!-- ============ 底部 Tab Bar（iOS 风格） ============ -->
        <nav class="tab-bar" role="tablist" aria-label="主导航">
            <button class="tab-bar__item is-active" role="tab"
                    aria-selected="true" aria-controls="panelChat"
                    data-tab="chat" id="tabChat">
                <span class="tab-bar__icon" aria-hidden="true">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="1.8"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 15.5a2.5 2.5 0 01-2.5 2.5H8l-4 3.5V6.5A2.5 2.5 0 016.5 4h11A2.5 2.5 0 0120 6.5v9z" />
                    </svg>
                </span>
                <span class="tab-bar__label">对话</span>
                <!-- 未读角标（W3b）：页面不能主动弹系统通知（移动端未授权），
                     新消息只能在页面内提示——这是「不假装能推送」的落地方式。 -->
                <span class="tab-bar__badge" id="tabBadge" hidden></span>
            </button>
            <button class="tab-bar__item" role="tab"
                    aria-selected="false" aria-controls="panelBrowse"
                    data-tab="browse" id="tabBrowse">
                <span class="tab-bar__icon" aria-hidden="true">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="1.8"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 7.5A2.5 2.5 0 015.5 5h3.1a2.5 2.5 0 012 1l.9 1.3h7A2.5 2.5 0 0121 9.8v6.7a2.5 2.5 0 01-2.5 2.5h-13A2.5 2.5 0 013 16.5V7.5z" />
                    </svg>
                </span>
                <span class="tab-bar__label">文件</span>
            </button>
            <button class="tab-bar__item" role="tab"
                    aria-selected="false" aria-controls="panelDevices"
                    data-tab="devices" id="tabDevices">
                <span class="tab-bar__icon" aria-hidden="true">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="1.8"
                         stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="4.5" width="13" height="9" rx="1.8" />
                        <path d="M9.5 13.5V17" />
                        <path d="M6.5 17h6" />
                        <rect x="16.5" y="8" width="5.5" height="9.5" rx="1.8" />
                    </svg>
                </span>
                <span class="tab-bar__label">设备</span>
            </button>
        </nav>

        <!-- Toast 提示容器 -->
        <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>

    <!-- app.js 同样免令牌加载，配对逻辑在其中完成 -->
    <script src="app.js" defer></script>
</body>
</html>
